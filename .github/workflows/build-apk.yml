name: Build HO JAGAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: find_zip
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> $GITHUB_ENV
          echo "Found ZIP: $ZIP"

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project

          unzip -o "$ZIP" -d android-project

          echo "Android project files:"
          find android-project -maxdepth 4 -type f | head -150

      - name: Find Android project
        run: |
          SETTINGS=$(find android-project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Give Gradle permission
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew || true

      - name: Build HO JAGAR APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          echo "========== APK FILES =========="
          find android-project -type f -name "*.apk" -print

      - name: Upload Updated APK
        uses: actions/upload-artifact@v4
        with:
          name: HO-JAGAR-COMPETITIVE-UPDATED-APK
          path: android-project/**/*.apk
          if-no-files-found: error
